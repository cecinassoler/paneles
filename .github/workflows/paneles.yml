name: Paneles vendedores

on:
  schedule:
    # Cada 60 minutos, todo el dia (minuto 20 de cada hora)
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar datos desde OneDrive
        env:
          ONEDRIVE_URL: ${{ secrets.ONEDRIVE_URL }}
        run: |
          mkdir -p pages
          u=$(printf '%s' "$ONEDRIVE_URL" | tr -d '[:space:]"')
          case "$u" in *\?*) d="$u&download=1";; *) d="$u?download=1";; esac
          enc=$(printf '%s' "$u" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          ok=0; n=0
          for x in "$d" "https://api.onedrive.com/v1.0/shares/u!$enc/root/content" "$u"; do
            n=$((n+1))
            code=$(curl -sSL -A "$UA" -c cj.txt -b cj.txt -o pages/p1.txt -w '%{http_code} %{url_effective}' "$x" || echo fallo)
            if head -c 9 pages/p1.txt 2>/dev/null | grep -q SOLERGZ1; then echo "Descarga OK (metodo $n)"; ok=1; break; fi
            host=$(printf '%s' "$code" | sed -E 's#^[^ ]* https?://([^/]+).*#\1#')
            tit=$(grep -o -i '<title>[^<]*' pages/p1.txt 2>/dev/null | head -1 | cut -c8-80)
            echo "Metodo $n: HTTP ${code%% *} | termina en: $host | tipo: $(file -b pages/p1.txt 2>/dev/null | cut -c1-40) | titulo: $tit"
          done
          rm -f cj.txt
          [ $ok = 1 ] || { echo "OneDrive no entrega el archivo con ese link. Abrelo en una ventana de incognito: si pide iniciar sesion, el link no es 'Cualquier persona'."; exit 1; }

      - name: Descargar metas desde OneDrive (si falla, se usan las metas de SOLER_CONFIG)
        env:
          METAS_URL: ${{ secrets.METAS_URL }}
        run: |
          u=$(printf '%s' "$METAS_URL" | tr -d '[:space:]"')
          if [ -z "$u" ]; then echo "::warning::Falta el secreto METAS_URL: se usan las metas de SOLER_CONFIG"; exit 0; fi
          case "$u" in *\?*) d="$u&download=1";; *) d="$u?download=1";; esac
          enc=$(printf '%s' "$u" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          ok=0; n=0
          for x in "$d" "https://api.onedrive.com/v1.0/shares/u!$enc/root/content" "$u"; do
            n=$((n+1))
            code=$(curl -sSL -A "$UA" -c cj.txt -b cj.txt -o metas.xlsx -w '%{http_code}' "$x" || echo fallo)
            if head -c 2 metas.xlsx 2>/dev/null | grep -q PK; then echo "Metas descargadas (metodo $n)"; ok=1; break; fi
            echo "Metas metodo $n: HTTP $code | tipo: $(file -b metas.xlsx 2>/dev/null | cut -c1-40)"
          done
          rm -f cj.txt
          if [ $ok = 1 ]; then
            pip install --quiet openpyxl
            python3 -I metas_xlsx.py metas.xlsx metas.txt metas_anio.txt || rm -f metas.txt
          else
            rm -f metas.xlsx
            echo "::warning::OneDrive no entrega el Excel de metas con ese link (debe ser 'Cualquier persona'): se usan las metas de SOLER_CONFIG"
          fi

      - name: Armar paneles
        env:
          SOLER_CONFIG: ${{ secrets.SOLER_CONFIG }}
          CLAVE: ${{ secrets.CLAVE }}
          CLAVES: ${{ secrets.CLAVES }}
        run: |
          printf '%s' "$SOLER_CONFIG" > cfg_secreto.json
          # metas ya cargadas antes, guardadas en el repositorio (metas_guardadas.json)
          node guardar_metas.mjs unir cfg_secreto.json metas_guardadas.json cfg_base.json
          # metas.mjs siempre deja cfg.json: con las metas del Excel o, si no pudo leerlas, igual a cfg_base.json
          node metas.mjs metas.txt cfg_base.json cfg.json metas_anio.txt | tee metas.log
          # solo se usan (y se guardan) las metas de los ultimos 12 meses: desde el mismo mes del año pasado en adelante
          node guardar_metas.mjs recortar cfg.json
          if grep -q '"estado":"CAMBIO"' metas.log && [ "$(node guardar_metas.mjs guardar cfg.json metas_guardadas.json)" = "guardadas: cambio" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add metas_guardadas.json && git commit -m "Metas actualizadas desde el Excel" && git push || echo "::warning::No se pudieron guardar las metas en el repositorio"
          fi
          grep -q '"estado":"ERROR"' metas.log && echo "::warning::Metas no cargadas: $(grep -o '"error":"[^"]*"' metas.log)"
          grep -q '"estado":"OMITIDO"' metas.log && echo "::warning::Metas omitidas: $(grep -o '"motivo":"[^"]*"' metas.log). Agrega el año en la planilla (celda: Año 2027)"
          grep -q '"avisos":\[".*' metas.log && echo "::warning::$(grep -o '"avisos":\[[^]]*\]' metas.log)"
          node actualizar.mjs cfg.json pages plantilla.html out > out.log 2> err.log || true
          if ! grep -q '"estado": "OK"' out.log; then grep -o 'ERROR.*' out.log || echo "Fallo al armar los paneles"; exit 1; fi
          grep -o '"generado": "[^"]*"' out.log
          # Cifrado con clave por pagina (secreto CLAVES). Sin claves o si el cifrado falla, no se publica nada.
          if [ -z "$CLAVES" ]; then echo "ERROR: falta el secreto CLAVES (claves de las paginas)"; exit 1; fi
          printf '%s' "$CLAVES" > claves.json
          node cifrar.mjs claves.json out > cifrar.log 2>&1 || true
          rm -f claves.json
          if ! grep -q '"estado": "OK"' cifrar.log; then cat cifrar.log; echo "Fallo el cifrado: no se publica"; exit 1; fi
          grep -A12 '"sinClaveEliminados"' cifrar.log | head -12
          node publicar.mjs out/vendedores vendedores.txt site

      - name: Mantener activa la tarea (GitHub pausa las tareas tras 60 dias sin cambios)
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now - last)) -gt 4320000 ]; then
            date -u > ultima-ejecucion.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ultima-ejecucion.txt && git commit -m "Mantener activa la tarea" && git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
